  --mint:#3FA36B;--mint-tint:#DCF1E4;--mint-text:#23794A;--coral:#E2665A;--coral-tint:#FBE2E0;--coral-text:#C0392B;--sun:#D48A3A;--sun-tint:#FBEBD6;--sun-text:#935A12;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em;font-weight:600}
h2{font-size:22px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 120px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:1040px;margin:0 auto}
header.top .logo{width:32px;height:32px;flex:none}
header.top b{font:600 19px Outfit,Inter,sans-serif;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--acc-text);font-size:13px;font-weight:600;border:0}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
